<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourtManager — Login</title>
  <meta name="description" content="Acesse o CourtManager para gerenciar sua arena esportiva." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <div class="login-logo">
      <div class="brand-icon">CM</div>
      <span class="brand-name">CourtManager</span>
    </div>

    <div class="login-card">
      <h1 class="login-title">Portal do Gestor</h1>
      <p class="login-sub">Acesso exclusivo para a gestão da arena.</p>

      

      <form id="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div style="position:relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="toggle-password"
              aria-label="Mostrar senha"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;"
            >mostrar</button>
          </div>
        </div>

        <div style="text-align: right; margin-bottom: 24px;">
          <a href="esqueci-senha.html" style="font-size:13px;color:var(--muted);text-decoration:underline;">Esqueci minha senha</a>
        </div>

        <div id="login-error" role="alert" style="display:none;background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 14px;border-radius:var(--r-md);margin-bottom:var(--s-4);border:1px solid rgba(155,34,38,0.2);">
          E-mail ou senha incorretos.
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button type="submit" class="btn-primary btn-full" id="btn-login">Entrar</button>
          
          <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0;">
            <div style="height: 1px; background: var(--border); flex: 1;"></div>
            <span style="font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600;">Ou</span>
            <div style="height: 1px; background: var(--border); flex: 1;"></div>
          </div>
          
          <a href="cadastro.html" class="btn-full" style="display: inline-block; text-align: center; text-decoration: none; padding: 10px 16px; background: var(--bg-body); border: 1px solid var(--border); color: var(--charcoal); font-weight: 500; border-radius: var(--r-md); transition: all 0.2s;">
            Cadastrar Nova Empresa
          </a>
        </div>
      </form>
    </div>

    <p class="login-footer-text">
      CourtManager &copy; 2026 — Gestão de arenas esportivas
    </p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  /* Login form — UI only, sem lógica de autenticação real */
  const form = document.getElementById('login-form');
  const errorDiv = document.getElementById('login-error');
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    toggleBtn.textContent = isHidden ? 'ocultar' : 'mostrar';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';

    const email = document.getElementById('email').value;
    const senha = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');

    btn.textContent = 'Entrando...';
    btn.disabled = true;

    try {
      const response = await fetch('http://localhost:3000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });

      const data = await response.json();

      if (!response.ok) {
        if (window.showToast) {
          window.showToast(data.error || 'Erro ao fazer login.', 'error');
        } else {
          errorDiv.textContent = data.error || 'Erro ao fazer login.';
          errorDiv.style.display = 'block';
        }
        
        // Efeito de erro visual (shake)
        form.classList.add('shake-animation');
        setTimeout(() => form.classList.remove('shake-animation'), 500);

        btn.textContent = 'Entrar';
        btn.disabled = false;
        return;
      }

      // Login bem-sucedido: Salva token
      localStorage.setItem('courtmanager_token', data.token);
      localStorage.setItem('courtmanager_user', JSON.stringify(data.usuario));
      if (data.usuario.arena_nome) {
        localStorage.setItem('arena_nome', data.usuario.arena_nome);
      }

      // Permite apenas perfis de gestão
      if (data.usuario.perfil === 'Cliente') {
        errorDiv.textContent = 'Acesso negado. Esta página é exclusiva para a equipe de gestão da arena.';
        errorDiv.style.display = 'block';
        btn.textContent = 'Entrar';
        btn.disabled = false;
        // Remove os tokens que foram salvos indevidamente
        localStorage.removeItem('courtmanager_token');
        localStorage.removeItem('courtmanager_user');
        return;
      }

      window.location.href = 'index.html';

    } catch (error) {
      errorDiv.textContent = 'Erro de conexão com o servidor.';
      errorDiv.style.display = 'block';
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
