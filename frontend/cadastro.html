<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourtManager — Cadastro</title>
  <meta name="description" content="Crie sua conta no CourtManager." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <div class="login-logo">
      <div class="brand-icon">CM</div>
      <span class="brand-name">CourtManager</span>
    </div>

    <div class="login-card">
      <h1 class="login-title">Cadastre sua Empresa</h1>
      <p class="login-sub">Comece a gerenciar suas quadras hoje mesmo.</p>

      

      <form id="register-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu nome"
            required
          />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div style="position:relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="toggle-password"
              aria-label="Mostrar senha"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;"
            >mostrar</button>
          </div>
        </div>

        <div id="register-error" role="alert" style="display:none;background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 14px;border-radius:var(--r-md);margin-bottom:var(--s-4);border:1px solid rgba(155,34,38,0.2);">
          Erro ao cadastrar.
        </div>
        
        <div id="register-success" role="alert" style="display:none;background:var(--success-bg);color:var(--success);font-size:13px;padding:10px 14px;border-radius:var(--r-md);margin-bottom:var(--s-4);border:1px solid rgba(0,255,0,0.2);">
          Cadastro realizado com sucesso! Redirecionando...
        </div>

        <button type="submit" class="btn-primary btn-full" id="btn-register">Cadastrar</button>
      </form>
      
      <div style="text-align:center; margin-top:24px;">
        <a href="login.html" style="font-size:14px;color:var(--muted);text-decoration:underline;">Já possui uma conta? Faça login</a>
      </div>
    </div>

    <p class="login-footer-text">
      CourtManager &copy; 2026 — Gestão de arenas esportivas
    </p>
  </div>
</div>

<script>
  const form = document.getElementById('register-form');
  const errorDiv = document.getElementById('register-error');
  const successDiv = document.getElementById('register-success');
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    toggleBtn.textContent = isHidden ? 'ocultar' : 'mostrar';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const senha = document.getElementById('password').value;
    const btn = document.getElementById('btn-register');

    btn.textContent = 'Cadastrando...';
    btn.disabled = true;

    try {
      const response = await fetch('http://localhost:3000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, senha, perfil: 'Administrador' })
      });

      const data = await response.json();

      if (!response.ok) {
        errorDiv.textContent = data.error || 'Erro ao fazer cadastro.';
        errorDiv.style.display = 'block';
        btn.textContent = 'Cadastrar';
        btn.disabled = false;
        return;
      }

      successDiv.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 800);

    } catch (error) {
      errorDiv.textContent = 'Erro de conexão com o servidor.';
      errorDiv.style.display = 'block';
      btn.textContent = 'Cadastrar';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
