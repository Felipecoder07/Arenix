<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourtManager — Relatórios</title>
  <meta name="description" content="Relatórios de faturamento, ocupação, reservas e inadimplência da arena." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .rel-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:var(--s-4); margin-bottom:var(--s-5); }
    .rel-kpi { background:var(--surface); border:1px solid var(--border-passive); border-radius:var(--radius-lg); padding:var(--s-4) var(--s-5); }
    .rel-kpi-label { font-size:11px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
    .rel-kpi-value { font-size:24px; font-weight:700; color:var(--text); }
    .rel-kpi-value.green { color:#22c55e; }
    .rel-kpi-value.red { color:var(--danger); }
    .rel-kpi-value.amber { color:var(--pending); }

    .occ-bar-wrap { width:100%; background:var(--border-passive); border-radius:99px; height:10px; overflow:hidden; margin-top:6px; }
    .occ-bar { height:100%; border-radius:99px; background: linear-gradient(90deg, #6ee7b7, #34d399); transition:width .5s ease; }
    .occ-bar.medium { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
    .occ-bar.high { background: linear-gradient(90deg, #f87171, #ef4444); }

    .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:11px; font-weight:600; }
    .badge-green { background:#dcfce7; color:#166534; }
    .badge-red { background:#fee2e2; color:#991b1b; }
    .badge-amber { background:#fef3c7; color:#92400e; }
    .badge-gray { background:var(--border-passive); color:var(--muted); }

    /* Formas de Pagamento */
    .pag-method-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:var(--s-4); margin-bottom:var(--s-5); }
    .pag-method-card { background:var(--surface); border:1px solid var(--border-passive); border-radius:var(--radius-lg); padding:var(--s-4) var(--s-5); }
    .pag-method-name { font-size:13px; font-weight:600; margin-bottom:var(--s-2); }
    .pag-method-valor { font-size:20px; font-weight:700; color:var(--text); }
    .pag-method-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .pag-percent-bar { height:6px; border-radius:99px; margin-top:8px; background: linear-gradient(90deg, #818cf8, #6366f1); transition: width .5s ease; }

    /* Heatmap */
    .heatmap-wrap { display:flex; gap:var(--s-5); margin-bottom:var(--s-5); flex-wrap:wrap; }
    .heatmap-section { flex:1; min-width:280px; background:var(--surface); border:1px solid var(--border-passive); border-radius:var(--radius-lg); padding:var(--s-4) var(--s-5); }
    .heatmap-section h3 { font-size:13px; font-weight:600; margin-bottom:var(--s-3); color:var(--text); }
    .hora-row { display:flex; align-items:center; gap:var(--s-3); margin-bottom:6px; }
    .hora-label { font-size:12px; color:var(--muted); min-width:46px; text-align:right; }
    .hora-bar-wrap { flex:1; background:var(--border-passive); border-radius:99px; height:12px; overflow:hidden; }
    .hora-bar { height:100%; border-radius:99px; transition: width .5s ease; }
    .hora-count { font-size:12px; color:var(--muted); min-width:28px; text-align:right; }
    .dia-row { display:flex; align-items:center; gap:var(--s-3); margin-bottom:6px; }
    .dia-label { font-size:12px; color:var(--muted); min-width:32px; }
    .dia-bar-wrap { flex:1; background:var(--border-passive); border-radius:99px; height:12px; overflow:hidden; }
    .dia-bar { height:100%; border-radius:99px; background: linear-gradient(90deg, #34d399, #059669); transition: width .5s ease; }
    .dia-count { font-size:12px; color:var(--muted); min-width:28px; text-align:right; }

    /* Top Clientes */
    .top-client-row { display:flex; align-items:center; gap:var(--s-4); padding:var(--s-3) 0; border-bottom:1px solid var(--border-passive); }
    .top-client-row:last-child { border-bottom:none; }
    .client-rank { font-size:16px; font-weight:800; color:var(--accent); min-width:28px; text-align:center; }
    .client-rank.gold { color:#f59e0b; }
    .client-rank.silver { color:#9ca3af; }
    .client-rank.bronze { color:#b45309; }
    .client-info { flex:1; }
    .client-name { font-size:13px; font-weight:600; }
    .client-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .client-stats { text-align:right; }
    .client-valor { font-size:14px; font-weight:700; }
    .client-reservas { font-size:11px; color:var(--muted); }

    #table-title { font-size:13px; font-weight:600; }
    #table-count { font-size:12px; color:var(--muted); }

    #table-footer { padding:var(--s-4) var(--s-5); border-top:1px solid var(--border-passive); display:flex; gap:var(--s-6); flex-wrap:wrap; }
    #table-footer span { font-size:13px; font-weight:600; }

    .tab-bar { display:flex; gap:var(--s-2); margin-bottom:var(--s-5); border-bottom:2px solid var(--border-passive); padding-bottom:0; }
    .tab-bar .tab-btn { padding:10px 20px; border:none; background:none; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; border-radius:0; transition:all .2s; }
    .tab-bar .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .tab-bar .tab-btn:hover:not(.active) { color:var(--text); }

    .empty-state { padding:60px 20px; text-align:center; color:var(--muted); }
    .empty-state .icon { font-size:40px; margin-bottom:12px; }
    .empty-state p { font-size:14px; }

    #loading-indicator { display:none; text-align:center; padding:40px; color:var(--muted); font-size:13px; }
    .spinner { width:24px; height:24px; border:3px solid var(--border-passive); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
  <script src="js/auth-guard.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand"><div class="brand-icon">CM</div><span class="brand-name">CourtManager</span></div>
    <button class="sidebar-close" id="sidebarClose" aria-label="Fechar menu">✕</button>
  </div>
  <nav class="sidebar-nav" aria-label="Navegação principal">
    <a href="dashboard.html"         class="nav-item"><span class="nav-icon">⊡</span><span>Dashboard</span></a>
    <a href="reservas.html"      class="nav-item"><span class="nav-icon">⊞</span><span>Reservas</span></a>
    <a href="pagamentos.html"    class="nav-item"><span class="nav-icon">◈</span><span>Pagamentos</span></a>
    <a href="clientes.html"      class="nav-item"><span class="nav-icon">◉</span><span>Clientes</span></a>
    <a href="relatorios.html"    class="nav-item active"><span class="nav-icon">▤</span><span>Relatórios</span></a>
    <a href="auditoria.html"     class="nav-item"><span class="nav-icon">◎</span><span>Auditoria</span></a>
    <a href="configuracoes.html" class="nav-item"><span class="nav-icon">⊙</span><span>Configurações</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" id="sidebar-avatar">...</div>
      <div class="user-info">
        <span class="user-name" id="sidebar-name">Carregando...</span>
        <span class="user-role" id="sidebar-role">—</span>
      </div>
    </div>
    <a href="login.html" class="btn-logout" id="btn-logout">Sair</a>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <div class="page-title-block">
        <h1 class="page-title">Relatórios</h1>
        <span class="page-subtitle">Análise financeira e operacional</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-arena"></div>
    </div>
  </header>

  <div class="page-body">

    <!-- Tabs -->
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" data-rel="faturamento" role="tab">Faturamento</button>
      <button class="tab-btn" data-rel="ocupacao" role="tab">Ocupação</button>
      <button class="tab-btn" data-rel="reservas" role="tab">Reservas</button>
      <button class="tab-btn" data-rel="inadimplencia" role="tab">Inadimplência</button>
      <button class="tab-btn" data-rel="cancelamentos" role="tab">Cancelamentos</button>
      <button class="tab-btn" data-rel="formas-pagamento" role="tab">Formas de Pag.</button>
      <button class="tab-btn" data-rel="horarios-pico" role="tab">Horários de Pico</button>
      <button class="tab-btn" data-rel="top-clientes" role="tab">Top Clientes</button>
    </div>

    <!-- Filtros -->
    <div class="page-toolbar">
      <div class="filter-bar">
        <div>
          <label for="rel-inicio" style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">De</label>
          <input type="date" id="rel-inicio" style="width:auto;" />
        </div>
        <div>
          <label for="rel-fim" style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px;">Até</label>
          <input type="date" id="rel-fim" style="width:auto;" />
        </div>
        <select id="rel-quadra" style="width:auto;min-width:160px;align-self:flex-end;" aria-label="Filtrar por quadra">
          <option value="">Todas as quadras</option>
        </select>
        <button class="btn-primary" style="align-self:flex-end;" id="btn-gerar-relatorio">Gerar Relatório</button>
      </div>
      <div style="display:flex;gap:var(--s-3);">
        <button class="btn-ghost" id="btn-exportar-csv">↓ CSV</button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="rel-kpi-row" id="kpi-row"></div>

    <!-- Loading -->
    <div id="loading-indicator">
      <div class="spinner"></div>
      Carregando dados...
    </div>

    <!-- Tabela -->
    <div class="table-card" id="report-table-card" style="display:none;">
      <div style="padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border-passive);display:flex;align-items:center;justify-content:space-between;">
        <span id="table-title">—</span>
        <span id="table-count">—</span>
      </div>
      <div class="table-wrap">
        <table aria-label="Dados do relatório" id="report-table">
          <thead id="report-thead"></thead>
          <tbody id="report-tbody"></tbody>
        </table>
      </div>
      <div id="table-footer"></div>
    </div>

    <!-- Extra content area for charts / cards (Formas Pag, Pico, Top Clientes) -->
    <div id="extra-content" style="display:none;"></div>

    <!-- Empty state inicial -->
    <div class="empty-state" id="empty-state">
      <div class="icon">📋</div>
      <p>Selecione o período e clique em <strong>Gerar Relatório</strong></p>
    </div>

  </div>
</main>

<script src="js/app.js"></script>
<script>
  const API = 'http://localhost:3000/api';
  let dadosAtuais = null;
  let relAtivo = localStorage.getItem('courtmanager_rel_ativo') || 'faturamento';

  // ── Inicializar datas ──────────────────────────────────────────────────────
  const today = new Date();
  const tzOffset = today.getTimezoneOffset() * 60000;
  const todayStr = new Date(Date.now() - tzOffset).toISOString().split('T')[0];
  const firstDayStr = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
  document.getElementById('rel-inicio').value = firstDayStr;
  document.getElementById('rel-fim').value = todayStr;

  // ── Carregar quadras no select ─────────────────────────────────────────────
  async function carregarQuadras() {
    const token = localStorage.getItem('courtmanager_token');
    try {
      const res = await fetch(`${API}/quadras`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) return;
      const quadras = await res.json();
      const sel = document.getElementById('rel-quadra');
      quadras.forEach(q => {
        const opt = document.createElement('option');
        opt.value = q.id;
        opt.textContent = q.nome;
        sel.appendChild(opt);
      });
    } catch(e) { console.warn(e); }
  }

  // ── Formatar moeda ─────────────────────────────────────────────────────────
  function moeda(v) {
    return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function fmtData(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function badgeStatus(status) {
    const map = { 'Confirmada': 'badge-green', 'Cancelada': 'badge-red', 'Pendente': 'badge-amber', 'Pago': 'badge-green', 'Parcial': 'badge-amber', 'Estornado': 'badge-gray' };
    const cls = map[status] || 'badge-gray';
    return `<span class="badge ${cls}">${status}</span>`;
  }

  // ── Tabs ───────────────────────────────────────────────────────────────────
  function setTabAtiva(rel) {
    document.querySelectorAll('.tab-btn[data-rel]').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.tab-btn[data-rel="${rel}"]`);
    if (btn) btn.classList.add('active');
  }

  // Define tab ativa inicial baseada no localStorage
  setTabAtiva(relAtivo);

  document.querySelectorAll('.tab-btn[data-rel]').forEach(btn => {
    btn.addEventListener('click', () => {
      relAtivo = btn.dataset.rel;
      localStorage.setItem('courtmanager_rel_ativo', relAtivo);
      setTabAtiva(relAtivo);
      gerarRelatorio();
    });
  });

  function resetView() {
    dadosAtuais = null;
    document.getElementById('kpi-row').innerHTML = '';
    document.getElementById('report-table-card').style.display = 'none';
    document.getElementById('extra-content').style.display = 'none';
    document.getElementById('extra-content').innerHTML = '';
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('loading-indicator').style.display = 'none';
  }

  // ── Gerar Relatório ────────────────────────────────────────────────────────
  document.getElementById('btn-gerar-relatorio').addEventListener('click', gerarRelatorio);

  async function gerarRelatorio() {
    const token = localStorage.getItem('courtmanager_token');
    const inicio = document.getElementById('rel-inicio').value;
    const fim = document.getElementById('rel-fim').value;
    const quadra_id = document.getElementById('rel-quadra').value;

    if (!inicio || !fim) { alert('Selecione o período.'); return; }
    if (inicio > fim) { alert('A data inicial deve ser anterior à data final.'); return; }

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('report-table-card').style.display = 'none';
    document.getElementById('extra-content').style.display = 'none';
    document.getElementById('extra-content').innerHTML = '';
    document.getElementById('loading-indicator').style.display = 'block';
    document.getElementById('kpi-row').innerHTML = '';

    const params = new URLSearchParams({ data_inicio: inicio, data_fim: fim });
    if (quadra_id) params.append('quadra_id', quadra_id);

    try {
      const res = await fetch(`${API}/relatorios/${relAtivo}?${params}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao gerar relatório');

      dadosAtuais = data;
      document.getElementById('loading-indicator').style.display = 'none';
      renderizarRelatorio(relAtivo, data, inicio, fim);
    } catch(e) {
      document.getElementById('loading-indicator').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').innerHTML = `<div class="icon">⚠️</div><p>${e.message}</p>`;
    }
  }

  // ── Renderizadores ─────────────────────────────────────────────────────────
  function renderizarRelatorio(tipo, data, inicio, fim) {
    const nomeTipo = { faturamento: 'Faturamento', ocupacao: 'Ocupação', reservas: 'Reservas', inadimplencia: 'Inadimplência', cancelamentos: 'Cancelamentos', 'formas-pagamento': 'Formas de Pagamento', 'horarios-pico': 'Horários de Pico', 'top-clientes': 'Top Clientes' };
    document.getElementById('table-title').textContent = `Relatório de ${nomeTipo[tipo] || tipo} — ${fmtData(inicio)} a ${fmtData(fim)}`;

    // Decide qual área mostrar ANTES de renderizar
    const usaExtra = ['formas-pagamento', 'horarios-pico', 'top-clientes'].includes(tipo);
    document.getElementById('report-table-card').style.display = usaExtra ? 'none' : 'block';
    document.getElementById('extra-content').style.display = usaExtra ? 'block' : 'none';
    if (!usaExtra) document.getElementById('extra-content').innerHTML = '';

    // Chama o renderizador específico
    const renders = { faturamento: renderFaturamento, ocupacao: renderOcupacao, reservas: renderReservas, inadimplencia: renderInadimplencia, cancelamentos: renderCancelamentos, 'formas-pagamento': renderFormasPagamento, 'horarios-pico': renderHorariosPico, 'top-clientes': renderTopClientes };
    renders[tipo](data);
  }


  function renderFaturamento(data) {
    const { reservas, totais } = data;
    document.getElementById('table-count').textContent = `${reservas.length} registros`;

    // KPIs
    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Faturamento Bruto</div><div class="rel-kpi-value">${moeda(totais.bruto)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Recebido</div><div class="rel-kpi-value green">${moeda(totais.pago)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">A Receber</div><div class="rel-kpi-value ${totais.pendente > 0 ? 'red' : ''}">${moeda(totais.pendente)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Reservas</div><div class="rel-kpi-value">${reservas.length}</div></div>
    `;

    // Cabeçalho
    document.getElementById('report-thead').innerHTML = `<tr>
      <th>Data</th><th>ID</th><th>Cliente</th><th>Quadra</th><th>Horário</th>
      <th>Valor Total</th><th>Pago</th><th>Saldo</th><th>Método</th><th>Pagamento</th><th>Operador</th>
    </tr>`;

    // Corpo
    if (reservas.length === 0) {
      document.getElementById('report-tbody').innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px;">Nenhum registro no período.</td></tr>';
    } else {
      document.getElementById('report-tbody').innerHTML = reservas.map(r => {
        const saldo = r.valor_total - r.total_pago;
        return `<tr>
          <td>${fmtData(r.data_reserva)}</td>
          <td style="color:var(--muted);font-size:12px;">#${r.id}</td>
          <td>${r.cliente_nome}</td>
          <td>${r.quadra_nome}</td>
          <td>${r.hora_inicio}–${r.hora_fim}</td>
          <td>${moeda(r.valor_total)}</td>
          <td style="color:#22c55e;font-weight:500;">${moeda(r.total_pago)}</td>
          <td style="${saldo > 0 ? 'color:var(--danger);font-weight:500;' : ''}">${saldo > 0 ? moeda(saldo) : '—'}</td>
          <td style="font-size:12px;">${r.metodos || '—'}</td>
          <td>${badgeStatus(r.status_pagamento)}</td>
          <td style="font-size:12px;">${r.operador_nome || '—'}</td>
        </tr>`;
      }).join('');
    }

    // Footer
    document.getElementById('table-footer').innerHTML = `
      <span>Total: ${moeda(totais.bruto)}</span>
      <span style="color:#22c55e;">Recebido: ${moeda(totais.pago)}</span>
      <span style="color:var(--danger);">A receber: ${moeda(totais.pendente)}</span>
    `;
  }

  function renderOcupacao(data) {
    const { quadras, taxaGeral, periodo } = data;
    document.getElementById('table-count').textContent = `${quadras.length} quadras · ${periodo.dias} dias`;

    const totalReservas = quadras.reduce((a, b) => a + b.totalReservas, 0);
    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Taxa Média</div><div class="rel-kpi-value ${taxaGeral >= 75 ? 'red' : taxaGeral >= 40 ? 'amber' : 'green'}">${taxaGeral}%</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Quadras Monitoradas</div><div class="rel-kpi-value">${quadras.length}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Total de Reservas</div><div class="rel-kpi-value">${totalReservas}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Período (dias)</div><div class="rel-kpi-value">${periodo.dias}</div></div>
    `;

    document.getElementById('report-thead').innerHTML = `<tr>
      <th>Quadra</th><th>Reservas</th><th>Min. Reservados</th><th>Min. Bloqueados</th><th>Min. Disponíveis</th><th>Taxa de Ocupação</th>
    </tr>`;

    if (quadras.length === 0) {
      document.getElementById('report-tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;">Nenhuma quadra encontrada.</td></tr>';
    } else {
      document.getElementById('report-tbody').innerHTML = quadras.map(q => {
        const barClass = q.taxa >= 75 ? 'high' : q.taxa >= 40 ? 'medium' : '';
        return `<tr>
          <td><strong>${q.quadra_nome}</strong></td>
          <td>${q.totalReservas}</td>
          <td>${q.minutosReservados} min</td>
          <td>${q.minutosBloqueados} min</td>
          <td>${q.totalMinutosDisp} min</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:600;min-width:36px;">${q.taxa}%</span>
              <div class="occ-bar-wrap" style="flex:1;">
                <div class="occ-bar ${barClass}" style="width:${q.taxa}%;"></div>
              </div>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    document.getElementById('table-footer').innerHTML = `<span>Taxa geral de ocupação no período: ${taxaGeral}%</span>`;
  }

  function renderReservas(data) {
    const { reservas, totais } = data;
    document.getElementById('table-count').textContent = `${totais.total} registros`;

    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Total</div><div class="rel-kpi-value">${totais.total}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Confirmadas</div><div class="rel-kpi-value green">${totais.confirmadas}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Canceladas</div><div class="rel-kpi-value red">${totais.canceladas}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Pendentes</div><div class="rel-kpi-value amber">${totais.pendentes}</div></div>
    `;

    document.getElementById('report-thead').innerHTML = `<tr>
      <th>Data</th><th>ID</th><th>Cliente</th><th>Quadra</th><th>Horário</th><th>Valor</th><th>Status</th><th>Pagamento</th><th>Operador</th>
    </tr>`;

    if (reservas.length === 0) {
      document.getElementById('report-tbody').innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:40px;">Nenhum registro no período.</td></tr>';
    } else {
      document.getElementById('report-tbody').innerHTML = reservas.map(r => `<tr>
        <td>${fmtData(r.data_reserva)}</td>
        <td style="color:var(--muted);font-size:12px;">#${r.id}</td>
        <td>${r.cliente_nome}</td>
        <td>${r.quadra_nome}</td>
        <td>${r.hora_inicio}–${r.hora_fim}</td>
        <td>${moeda(r.valor_total)}</td>
        <td>${badgeStatus(r.status)}</td>
        <td>${badgeStatus(r.status_pagamento)}</td>
        <td style="font-size:12px;">${r.operador_nome || '—'}</td>
      </tr>`).join('');
    }

    document.getElementById('table-footer').innerHTML = `
      <span>Total: ${totais.total}</span>
      <span style="color:#22c55e;">Confirmadas: ${totais.confirmadas}</span>
      <span style="color:var(--danger);">Canceladas: ${totais.canceladas}</span>
    `;
  }

  function renderInadimplencia(data) {
    const { inadimplentes, totalDevido } = data;
    document.getElementById('table-count').textContent = `${inadimplentes.length} registros`;

    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Devedores</div><div class="rel-kpi-value ${inadimplentes.length > 0 ? 'red' : ''}">${inadimplentes.length}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Total a Receber</div><div class="rel-kpi-value ${totalDevido > 0 ? 'red' : ''}">${moeda(totalDevido)}</div></div>
    `;

    document.getElementById('report-thead').innerHTML = `<tr>
      <th>Data</th><th>ID</th><th>Cliente</th><th>Contato</th><th>Quadra</th><th>Horário</th><th>Valor Total</th><th>Pago</th><th>Saldo Devedor</th><th>Status Pag.</th>
    </tr>`;

    if (inadimplentes.length === 0) {
      document.getElementById('report-tbody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:#22c55e;padding:40px;font-weight:600;">✓ Nenhuma inadimplência no período!</td></tr>';
    } else {
      document.getElementById('report-tbody').innerHTML = inadimplentes.map(r => `<tr>
        <td>${fmtData(r.data_reserva)}</td>
        <td style="color:var(--muted);font-size:12px;">#${r.id}</td>
        <td>${r.cliente_nome}</td>
        <td style="font-size:12px;">${r.cliente_contato || '—'}</td>
        <td>${r.quadra_nome}</td>
        <td>${r.hora_inicio}–${r.hora_fim}</td>
        <td>${moeda(r.valor_total)}</td>
        <td style="color:#22c55e;font-weight:500;">${moeda(r.total_pago)}</td>
        <td style="color:var(--danger);font-weight:700;">${moeda(r.saldo_devedor)}</td>
        <td>${badgeStatus(r.status_pagamento)}</td>
      </tr>`).join('');
    }

    document.getElementById('table-footer').innerHTML = `
      <span style="color:var(--danger);">Total inadimplente: ${moeda(totalDevido)}</span>
    `;
  }

  function renderCancelamentos(data) {
    const { cancelamentos, totais } = data;
    document.getElementById('table-count').textContent = `${totais.total} registros`;

    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Cancelamentos</div><div class="rel-kpi-value ${totais.total > 0 ? 'red' : ''}">${totais.total}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Valor Perdido</div><div class="rel-kpi-value ${totais.valorPerdido > 0 ? 'red' : ''}">${moeda(totais.valorPerdido)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Estornados</div><div class="rel-kpi-value amber">${totais.estornados}</div></div>
    `;

    document.getElementById('report-thead').innerHTML = `<tr>
      <th>Data</th><th>ID</th><th>Cliente</th><th>Quadra</th><th>Horário</th><th>Motivo</th><th>Valor</th><th>Pago antes</th><th>Status Pag.</th><th>Operador</th>
    </tr>`;

    if (cancelamentos.length === 0) {
      document.getElementById('report-tbody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:#22c55e;padding:40px;font-weight:600;">✓ Nenhum cancelamento no período!</td></tr>';
    } else {
      document.getElementById('report-tbody').innerHTML = cancelamentos.map(r => `<tr>
        <td>${fmtData(r.data_reserva)}</td>
        <td style="color:var(--muted);font-size:12px;">#${r.id}</td>
        <td>${r.cliente_nome}</td>
        <td>${r.quadra_nome}</td>
        <td>${r.hora_inicio}–${r.hora_fim}</td>
        <td><span class="badge badge-gray" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; display:inline-block;" title="${r.observacoes_cancelamento || ''}">${r.motivo_cancelamento || 'Não informado'}</span></td>
        <td>${moeda(r.valor_total)}</td>
        <td style="color:#22c55e;">${moeda(r.total_pago)}</td>
        <td>${badgeStatus(r.status_pagamento)}</td>
        <td style="font-size:12px;">${r.operador_nome || '—'}</td>
      </tr>`).join('');
    }

    document.getElementById('table-footer').innerHTML = `
      <span>Total cancelamentos: ${totais.total}</span>
      <span style="color:var(--danger);">Valor perdido: ${moeda(totais.valorPerdido)}</span>
    `;
  }

  // ── Exportar CSV ───────────────────────────────────────────────────────────
  document.getElementById('btn-exportar-csv').addEventListener('click', () => {
    if (!dadosAtuais) { alert('Gere um relatório primeiro.'); return; }

    let rows = [];
    const sep = ';';

    if (relAtivo === 'faturamento') {
      rows.push(['Data','ID','Cliente','Quadra','Horário','Valor Total','Pago','Saldo','Métodos','Pagamento','Operador'].join(sep));
      dadosAtuais.reservas.forEach(r => {
        const saldo = Math.max(0, r.valor_total - r.total_pago);
        rows.push([fmtData(r.data_reserva), r.id, r.cliente_nome, r.quadra_nome, `${r.hora_inicio}-${r.hora_fim}`, r.valor_total.toFixed(2), r.total_pago.toFixed(2), saldo.toFixed(2), r.metodos, r.status_pagamento, r.operador_nome || ''].join(sep));
      });
    } else if (relAtivo === 'ocupacao') {
      rows.push(['Quadra','Reservas','Min. Reservados','Min. Bloqueados','Min. Disponíveis','Taxa %'].join(sep));
      dadosAtuais.quadras.forEach(q => {
        rows.push([q.quadra_nome, q.totalReservas, q.minutosReservados, q.minutosBloqueados, q.totalMinutosDisp, q.taxa].join(sep));
      });
    } else if (relAtivo === 'reservas') {
      rows.push(['Data','ID','Cliente','Quadra','Horário','Valor','Status','Pagamento','Operador'].join(sep));
      dadosAtuais.reservas.forEach(r => {
        rows.push([fmtData(r.data_reserva), r.id, r.cliente_nome, r.quadra_nome, `${r.hora_inicio}-${r.hora_fim}`, r.valor_total.toFixed(2), r.status, r.status_pagamento, r.operador_nome || ''].join(sep));
      });
    } else if (relAtivo === 'inadimplencia') {
      rows.push(['Data','ID','Cliente','Contato','Quadra','Horário','Valor Total','Pago','Saldo Devedor'].join(sep));
      dadosAtuais.inadimplentes.forEach(r => {
        rows.push([fmtData(r.data_reserva), r.id, r.cliente_nome, r.cliente_contato || '', r.quadra_nome, `${r.hora_inicio}-${r.hora_fim}`, r.valor_total.toFixed(2), r.total_pago.toFixed(2), r.saldo_devedor.toFixed(2)].join(sep));
      });
    } else if (relAtivo === 'cancelamentos') {
      rows.push(['Data','ID','Cliente','Quadra','Horário','Motivo','Observações','Valor','Pago Antes','Status Pag.','Operador'].join(sep));
      dadosAtuais.cancelamentos.forEach(r => {
        rows.push([fmtData(r.data_reserva), r.id, r.cliente_nome, r.quadra_nome, `${r.hora_inicio}-${r.hora_fim}`, r.motivo_cancelamento || 'Não informado', r.observacoes_cancelamento || '', r.valor_total.toFixed(2), r.total_pago.toFixed(2), r.status_pagamento, r.operador_nome || ''].join(sep));
      });
    }

    const csvContent = '\uFEFF' + rows.join('\n'); // BOM para Excel
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relatorio_${relAtivo}_${document.getElementById('rel-inicio').value}_${document.getElementById('rel-fim').value}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ── Formas de Pagamento ──────────────────────────────────────────────────
  function renderFormasPagamento(data) {
    const { porMetodo, transacoes, totalGeral } = data;
    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Total Recebido</div><div class="rel-kpi-value green">${moeda(totalGeral)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Métodos Usados</div><div class="rel-kpi-value">${porMetodo.length}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Transações</div><div class="rel-kpi-value">${transacoes.length}</div></div>
    `;

    const methodColors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#3b82f6','#8b5cf6'];
    const methodIcons = { 'Pix': '◉ Pix', 'Dinheiro': '◎ Dinheiro', 'Cartão Créd.': '◈ Cartão Créd.', 'Cartão Déb.': '◈ Cartão Déb.', 'Cheque': '▣ Cheque' };

    const cardsHTML = porMetodo.length === 0
      ? '<p style="color:var(--muted);font-size:13px;">Nenhum pagamento no período.</p>'
      : `<div class="pag-method-grid">${porMetodo.map((m, i) => `
        <div class="pag-method-card">
          <div class="pag-method-name">${methodIcons[m.metodo] || m.metodo}</div>
          <div class="pag-method-valor">${moeda(m.total_valor)}</div>
          <div class="pag-method-sub">${m.total_transacoes} transações · ${m.percentual}% do total</div>
          <div class="pag-percent-bar" style="width:${m.percentual}%;background:${methodColors[i % methodColors.length]};"></div>
        </div>`).join('')}</div>`;

    const tableHTML = `
      <div class="table-card" style="margin-top:0;">
        <div style="padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border-passive);display:flex;justify-content:space-between;">
          <span style="font-size:13px;font-weight:600;">Histórico de Transações</span>
          <span style="font-size:12px;color:var(--muted);">${transacoes.length} registros</span>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Data</th><th>Hora</th><th>Método</th><th>Valor</th><th>Cliente</th><th>Quadra</th><th>Operador</th></tr></thead>
          <tbody>${transacoes.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px;">Nenhuma transação.</td></tr>'
            : transacoes.map(t => `<tr>
              <td>${fmtData(t.data_pagamento)}</td>
              <td style="color:var(--muted);font-size:12px;">${t.hora_pagamento || ''}</td>
              <td><span class="badge badge-gray">${t.metodo}</span></td>
              <td style="color:#22c55e;font-weight:600;">${moeda(t.valor)}</td>
              <td>${t.cliente_nome}</td>
              <td>${t.quadra_nome}</td>
              <td style="font-size:12px;">${t.operador_nome || '—'}</td>
            </tr>`).join('')}
          </tbody></table>
        </div>
      </div>`;

    document.getElementById('extra-content').innerHTML = cardsHTML + tableHTML;
  }

  // ── Horários de Pico ─────────────────────────────────────────────────────
  function renderHorariosPico(data) {
    const { porHora, maxPico, porDiaSemana, totalReservas } = data;
    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Total de Reservas</div><div class="rel-kpi-value">${totalReservas}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Horário de Pico</div><div class="rel-kpi-value">${porHora.length > 0 ? porHora.reduce((a,b) => a.total > b.total ? a : b).hora + ':00' : '—'}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Dia Mais Movido</div><div class="rel-kpi-value">${porDiaSemana.reduce((a,b) => a.total > b.total ? a : b).dia}</div></div>
    `;

    const horasHTML = porHora.length === 0
      ? '<p style="color:var(--muted);font-size:13px;">Sem dados no período.</p>'
      : porHora.map(h => {
          const pct = Math.round((h.total / maxPico) * 100);
          const cor = pct >= 80 ? '#ef4444' : pct >= 50 ? '#f59e0b' : '#34d399';
          return `<div class="hora-row">
            <span class="hora-label">${String(h.hora).padStart(2,'0')}:00</span>
            <div class="hora-bar-wrap"><div class="hora-bar" style="width:${pct}%;background:${cor};"></div></div>
            <span class="hora-count">${h.total}</span>
          </div>`;
        }).join('');

    const diasHTML = porDiaSemana.map(d => {
      const maxDia = Math.max(...porDiaSemana.map(x => x.total), 1);
      const pct = Math.round((d.total / maxDia) * 100);
      return `<div class="dia-row">
        <span class="dia-label">${d.dia}</span>
        <div class="dia-bar-wrap"><div class="dia-bar" style="width:${pct}%;"></div></div>
        <span class="dia-count">${d.total}</span>
      </div>`;
    }).join('');

    document.getElementById('extra-content').innerHTML = `
      <div class="heatmap-wrap">
        <div class="heatmap-section" style="max-height:420px;overflow-y:auto;">
          <h3>Reservas por Horário</h3>
          ${horasHTML}
        </div>
        <div class="heatmap-section">
          <h3>Reservas por Dia da Semana</h3>
          ${diasHTML}
        </div>
      </div>`;
  }

  // ── Top Clientes ─────────────────────────────────────────────────────────────
  function renderTopClientes(data) {
    const { clientes, totalFaturado } = data;
    document.getElementById('kpi-row').innerHTML = `
      <div class="rel-kpi"><div class="rel-kpi-label">Clientes Ativos</div><div class="rel-kpi-value">${clientes.length}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Faturamento Total</div><div class="rel-kpi-value green">${moeda(totalFaturado)}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label"># 1 em Reservas</div><div class="rel-kpi-value">${clientes.length > 0 ? clientes[0].nome.split(' ')[0] : '—'}</div></div>
    `;

    const rankIcon = (pos) => {
      if (pos === 1) return '<span class="client-rank gold">★</span>';
      if (pos === 2) return '<span class="client-rank silver">★</span>';
      if (pos === 3) return '<span class="client-rank bronze">★</span>';
      return `<span class="client-rank">#${pos}</span>`;
    };

    const listHTML = clientes.length === 0
      ? '<p style="color:var(--muted);padding:20px;font-size:13px;">Nenhum cliente com reservas no período.</p>'
      : clientes.map(c => `
        <div class="top-client-row">
          ${rankIcon(c.posicao)}
          <div class="client-info">
            <div class="client-name">${c.nome}</div>
            <div class="client-sub">${c.total_reservas} reserva${c.total_reservas !== 1 ? 's' : ''} · Última: ${fmtData(c.ultima_reserva)} · ${c.telefone || 'Sem contato'}</div>
          </div>
          <div class="client-stats">
            <div class="client-valor">${moeda(c.valor_total_gerado)}</div>
            <div class="client-reservas">Ticket médio ${moeda(c.ticket_medio)}${c.saldo_devedor > 0 ? ` · <span style="color:var(--danger);">Deve ${moeda(c.saldo_devedor)}</span>` : ''}</div>
          </div>
        </div>`).join('');

    document.getElementById('extra-content').innerHTML = `
      <div class="table-card">
        <div style="padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border-passive);">
          <span style="font-size:13px;font-weight:600;">Ranking de Clientes</span>
        </div>
        <div style="padding:var(--s-2) var(--s-5);">${listHTML}</div>
      </div>`;
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  async function initRelatorios() {
    await carregarQuadras();
    gerarRelatorio(); // Auto-fetch initial report
  }
  initRelatorios();
</script>
</body>
</html>
